name: Build StreamNova APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "streamnova",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.streamnova.app",
            "appName": "StreamNova",
            "webDir": "www",
            "server": {
              "url": "https://stream-nova-app.base44.app",
              "androidScheme": "https",
              "allowNavigation": ["stream-nova-app.base44.app"]
            }
          }
          EOF
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>StreamNova</title></head>
          <body style="background:#080810;color:#fff;font-family:sans-serif;text-align:center;padding-top:30vh">
          <h2>StreamNova</h2><p>Loading...</p>
          <a style="color:#d4af37" href="https://stream-nova-app.base44.app">Open StreamNova</a>
          </body></html>
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StreamNova-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
